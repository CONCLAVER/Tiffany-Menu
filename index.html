<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffany Food & Drink — Меню</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Comfortaa:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== FLAG SPRITE ===== -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="flag-ru" viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#ffffff"/>
            <rect y="6.7" width="30" height="6.7" fill="#0039a6"/>
            <rect y="13.3" width="30" height="6.7" fill="#d52b1e"/>
        </symbol>
        <symbol id="flag-es" viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#aa151b"/>
            <rect y="5" width="30" height="10" fill="#f1bf00"/>
        </symbol>
        <symbol id="flag-cl" viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#ffffff"/>
            <rect y="10" width="30" height="10" fill="#d52b1e"/>
            <rect width="10" height="10" fill="#0039a6"/>
            <path d="M5 2 L5.71 4.03 L7.85 4.07 L6.14 5.37 L6.76 7.43 L5 6.2 L3.24 7.43 L3.86 5.37 L2.15 4.07 L4.29 4.03 Z" fill="#ffffff"/>
        </symbol>
    </svg>

    <!-- ===== HERO ===== -->
    <section class="hero" id="hero">
        <div class="hero__overlay"></div>
        <div class="hero__content">
            <div class="hero__grid">
                <div class="hero__logo">
                    <div class="hero__logo-card">
                        <img class="logo-tiffany" src="img/logo-main.png" alt="Tiffany food &amp; drink">
                    </div>
                </div>
                <a href="#menu" class="hero-card hero-card--food">
                    <svg class="hero-card__icon" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="24" cy="27" r="10.5"/>
                        <circle cx="24" cy="27" r="5"/>
                        <path d="M4.5 16v6a2.5 2.5 0 0 0 5 0v-6"/>
                        <path d="M7 16v22"/>
                        <path d="M41 16c-2.8 2.6-4 6.2-4 9.5 0 1.9 1.8 3 4 3"/>
                        <path d="M41 16v22"/>
                    </svg>
                    <span class="hero-card__label">Меню</span>
                    <span class="hero-card__desc">Горячие и холодные закуски, паста, пицца, салаты, десерты</span>
                </a>
                <a href="#bar" class="hero-card hero-card--bar">
                    <svg class="hero-card__icon" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M10 9h28L24 27Z"/>
                        <path d="M24 27v13"/>
                        <path d="M15 40h18"/>
                        <circle cx="29" cy="14" r="2.6"/>
                        <path d="M34 5l-5 9"/>
                    </svg>
                    <span class="hero-card__label">Барная карта</span>
                    <span class="hero-card__desc">Чай, кофе, вина, коктейли, настойки</span>
                </a>
            </div>
        </div>
        <a href="#menu" class="hero__scroll">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </a>
    </section>

    <!-- ===== NAV ===== -->
    <nav class="nav" id="nav">
        <div class="nav__inner">
            <a href="#hero" class="nav__logo">
                <img src="img/logo-nav.png" alt="Tiffany" class="nav__logo-img">
            </a>
            <div class="nav__links">
                <a href="#menu" class="nav__link">Меню</a>
                <a href="#bar" class="nav__link">Барная карта</a>
            </div>
        </div>
    </nav>

    <!-- ===== FOOD MENU ===== -->
    <section class="menu-section" id="menu">
        <div class="container">
            <h2 class="section-title section-title--food">Меню</h2>

            <div class="filters" data-section="food">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="hot-appetizers">Горячие закуски</button>
                <button class="filter-btn" data-filter="cold-appetizers">Холодные закуски</button>
                <button class="filter-btn" data-filter="fryer">Фритюр</button>
                <button class="filter-btn" data-filter="soups">Супы</button>
                <button class="filter-btn" data-filter="pasta">Паста</button>
                <button class="filter-btn" data-filter="pizza">Пицца</button>
                <button class="filter-btn" data-filter="meat-fish">Мясо и рыба</button>
                <button class="filter-btn" data-filter="salads">Салаты</button>
                <button class="filter-btn" data-filter="desserts">Десерты</button>
            </div>

            <div class="menu-grid" id="food-grid"></div>
        </div>
    </section>

    <!-- ===== BAR MENU ===== -->
    <section class="menu-section menu-section--bar" id="bar">
        <div class="container">
            <h2 class="section-title section-title--bar">Барная карта</h2>

            <div class="filters filters--bar" data-section="bar">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="tea">Чай</button>
                <button class="filter-btn" data-filter="coffee">Кофе</button>
                <button class="filter-btn" data-filter="cold-drinks">Холодные напитки</button>
                <button class="filter-btn" data-filter="strong">Крепкие напитки</button>
                <button class="filter-btn" data-filter="sparkling-wine">Игристые вина</button>
                <button class="filter-btn" data-filter="still-wine">Тихие вина</button>
                <button class="filter-btn" data-filter="cocktails">Коктейли</button>
                <button class="filter-btn" data-filter="beer">Пиво</button>
                <button class="filter-btn" data-filter="tiffany-infusions">Тиффани настаивает</button>
            </div>

            <div class="menu-grid" id="bar-grid"></div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <div class="footer__content">
                <img class="footer__stamp" src="img/logo-stamp@2x.png" alt="Tiffany stamp">
                <img class="footer__logo-main" src="img/logo-main-white.png" alt="Tiffany food &amp; drink">
            </div>
            <p class="footer__copy">&copy; 2026 Tiffany Food &amp; Drink. Все права защищены.</p>
        </div>
    </footer>

    <!-- Back to top -->
    <button class="back-to-top" id="backToTop" aria-label="Наверх">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <script src="js/menu-renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
